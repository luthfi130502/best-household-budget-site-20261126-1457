<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeLedger — Household Budget Planner</title>
<meta name="description" content="HomeLedger is a household budget planner: track income and spending, set monthly budgets per category, save toward goals, and see where the money goes — all offline, in your browser.">
<link rel="stylesheet" href="style.css">
<script type="module" src="main.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">$</span>
    <a href="#/" class="brand-name">HomeLedger</a>
    <span class="brand-tag">Household Budget Planner</span>
  </div>
  <nav class="mainnav" aria-label="Main navigation">
    <a href="#/" data-nav="dashboard">Dashboard</a>
    <a href="#/transactions" data-nav="transactions">Transactions</a>
    <a href="#/budgets" data-nav="budgets">Budgets</a>
    <a href="#/goals" data-nav="goals">Goals</a>
    <a href="#/reports" data-nav="reports">Reports</a>
    <a href="#/settings" data-nav="settings">Settings</a>
  </nav>
  <div class="month-picker">
    <label for="month-select">Month</label>
    <select id="month-select" aria-label="Budget month"></select>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<footer class="site-footer">
  <p>HomeLedger keeps your budget on your own device — nothing leaves this browser. Data is saved in local storage, so it is here when you come back.</p>
  <p><a href="#/settings">Settings &amp; data</a> &middot; <a href="#/reports">Monthly reports</a> &middot; <a href="#/goals">Savings goals</a></p>
</footer>
</body>
</html>
